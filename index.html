<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K Christmas Quiz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-container">

    <section id="welcomeScreen" class="screen">

      <div class="quiz-card">

        <p class="eyebrow">
          Y2K CHRISTMAS PARTY
        </p>

        <h1>
          🎄 Y2K Christmas Quiz 🎄
        </h1>

        <p class="description">
          15 題懷舊挑戰<br>
          正確率 70% ＋ 速度 30%
        </p>

        <label for="playerName">
          玩家姓名
        </label>

        <input
          id="playerName"
          type="text"
          maxlength="20"
          placeholder="請輸入姓名（排行榜顯示名稱）">

        <p id="nameError" class="error-message"></p>

        <button id="startBtn">
          開始挑戰
        </button>

      </div>

    </section>
<section id="testScreen" class="screen hidden">

  <div class="quiz-card">

    <p class="eyebrow">
      QUESTION
    </p>

    <h2 id="questionNumber">
      第 1 題 / 15 題
    </h2>

    <p id="questionText" class="description">
      
      2000年代初最受歡迎的即時通訊軟體是？
    </p>

    <div id="imageAnswers" class="image-answers hidden">
  <button id="imageAnswerA" class="image-answer" type="button">
    <span class="image-label">A</span>
    <img id="imageA" alt="選項 A">
  </button>

  <button id="imageAnswerB" class="image-answer" type="button">
    <span class="image-label">B</span>
    <img id="imageB" alt="選項 B">
  </button>

  <button id="imageAnswerC" class="image-answer" type="button">
    <span class="image-label">C</span>
    <img id="imageC" alt="選項 C">
  </button>

  <button id="imageAnswerD" class="image-answer" type="button">
    <span class="image-label">D</span>
    <img id="imageD" alt="選項 D">
  </button>
</div>
    
    <button id="answerA">
      MSN Messenger
    </button>

    <br><br>

    <button id="answerB">
      LINE
    </button>

    <br><br>

    <button id="answerC">
      Discord
    </button>

    <br><br>

    <button id="answerD">
      Telegram
    </button>

  </div>

</section>

<section id="resultScreen" class="screen hidden">

  <div class="quiz-card">

    <p class="eyebrow">
      RESULT
    </p>

    <h2>
      🎉 測驗完成
    </h2>

    <p id="resultName" class="description"></p>

    <p id="resultScore" class="description"></p>

  </div>

</section>
    
  </main>

  <script src="app.js"></script>

</body>

</html>

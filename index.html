<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K Christmas Quiz</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-container">

    <section id="welcomeScreen" class="screen">

      <div class="quiz-card">

        <p class="eyebrow">
          Y2K CHRISTMAS PARTY
        </p>

        <h1>
          🎄 Y2K Christmas Quiz 🎄
        </h1>

        <p class="description">
          15 題懷舊挑戰<br>
          正確率 70% ＋ 速度 30%
        </p>

        <label for="playerName">
          玩家姓名
        </label>

        <input
          id="playerName"
          type="text"
          maxlength="20"
          placeholder="請輸入姓名（排行榜顯示名稱）"
        >

        <p id="nameError" class="error-message"></p>

        <button id="startBtn">
          開始挑戰
        </button>

      </div>

    </section>

    <section id="testScreen" class="screen hidden">

      <div class="quiz-card">

        <h2 id="welcomeMessage">
          歡迎加入挑戰
        </h2>

        <p class="description">
          準備開始 Y2K 挑戰！
        </p>

        <button id="backBtn">
          返回首頁
        </button>

      </div>

    </section>

  </main>

&lt;script src="app.js"&gt;&lt;/script&gt;

</body>

</html>
